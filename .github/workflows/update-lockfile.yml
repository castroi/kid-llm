# Keeps a branch's package-lock.json right, for when `npm install` can't run locally.
# On every push to a branch other than main it regenerates the lockfile when it doesn't
# match package.json, commits it to that branch and starts CI for the new commit.
# It never touches main. Its own commit doesn't start it again (pushes made with the
# workflow token never do). If it committed, pull before you push again.
name: Update lockfile

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the lockfile
  actions: write # start CI for that commit (pushes by this workflow don't trigger it)

concurrency: lockfile-${{ github.ref }}

jobs:
  lockfile:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits because this job can write to the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave a write token in .git/config for the npm step; only the push below gets it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only when `npm ci` would refuse the lockfile, so a push that changed no dependency
      # can't pick up lockfile churn. Resolves versions only; no package code runs.
      - name: Update package-lock.json
        run: |
          if [ -f package-lock.json ] && npm ci --dry-run --ignore-scripts --no-audit --no-fund >/dev/null 2>&1; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit if anything changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package-lock.json" -m "Made by the \"Update lockfile\" workflow."
          # The token goes in a header for this one command only, never into the URL or .git/config.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Works once ci.yml is on main; before that, push any commit to rerun CI.
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
