name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # started by "Update lockfile" after it commits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Installs exactly what package-lock.json lists; no install scripts run (.npmrc).
      - name: Install
        run: npm ci --no-audit --no-fund

      # Known vulnerabilities in the libraries that ship inside the app (not the build tools).
      - name: Audit shipped libraries
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails below the thresholds in vite.config.ts.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Real WebKit (her phone is Safari) at iPhone sizes, next to "check" so it doesn't wait for it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      # Browsers are tied to the Playwright version and built for one Ubuntu release and CPU.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Skips the download when cached; the system libraries are installed every time.
      - name: Install browsers
        run: npx playwright install --with-deps webkit

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npx playwright test

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
