# Weekly pull requests for newer versions of the libraries and of the pinned GitHub Actions.
# Each one goes through CI and the owner's review like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
